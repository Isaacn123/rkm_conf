services:
  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=rkmconf
      - MYSQL_USER=rkmconf
      - MYSQL_PASSWORD=rkmconf_password
      - MYSQL_ROOT_PASSWORD=root_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=rkmconf
      - MYSQL_USER=rkmconf
      - MYSQL_PASSWORD=rkmconf_password
      - ADMIN_TOKEN=change_me_admin_token
    depends_on:
      - mysql
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:

